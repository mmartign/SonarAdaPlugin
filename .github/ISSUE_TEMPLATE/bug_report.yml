name: Bug report
description: Report a problem with the SonarQube Ada Plugin
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include relevant `sonar-project.properties` settings and, if possible, a minimal Ada snippet that triggers the issue.
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: sonarqube-version
    attributes:
      label: SonarQube Server version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: SonarScanner or SonarQube Compute Engine logs, if any. This will be formatted as code automatically.
      render: shell
