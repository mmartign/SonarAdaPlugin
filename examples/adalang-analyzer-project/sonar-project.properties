sonar.projectKey=spazioit-adalang-analyzer-example
sonar.projectName=Spazio IT AdaLang Analyzer Example
sonar.projectVersion=1.0

sonar.sources=src
sonar.sourceEncoding=UTF-8
sonar.ada.file.suffixes=.adb,.ads,.ada

# Import a report generated before SonarScanner runs. Relative paths are
# resolved from the directory containing this project configuration.
sonar.ada.adalang.enabled=false
sonar.ada.adalang.reportPaths=reports/adalang-report.csv
sonar.ada.adalang.failOnError=true
